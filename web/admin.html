<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><meta name="robots" content="noindex">
<style>body{font:15px/1.5 system-ui,sans-serif;margin:0;background:#F6F5F2;color:#14201B}.w{max-width:1100px;margin:auto;padding:16px}
input,select,button{font:inherit;padding:9px;border:1px solid #CFCBC2;background:#fff;min-height:40px}button{cursor:pointer;background:#14201B;color:#fff;border:0}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}.k div{background:#fff;padding:12px;border:1px solid #E2DFD8}.k b{display:block;font-size:20px}
.o{background:#fff;border:1px solid #E2DFD8;padding:12px;margin:10px 0}.o>div{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}.err{color:#9B1C1C}small{color:#5C6660}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}.product{margin:0;min-width:0}.product label{display:block;margin-top:10px}.product input,.product select,.product textarea{width:100%;margin-top:4px}.product textarea{min-height:78px}.product .preview{width:100%;height:220px;object-fit:cover;background:#f0efec;margin-top:10px}.product .status{display:block;margin-top:8px}.hint{color:#5C6660}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.variant-list{display:grid;gap:8px;margin-top:8px}.variant{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:10px;background:#F6F5F2;border:1px solid #E2DFD8}.variant label{margin:0;font-size:12px}.variant .check{display:flex;align-items:center;gap:6px;grid-column:span 2}.variant .check input,.check input{width:auto;margin:0}.product-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.product-head h2{font-size:20px}.section-title{margin:18px 0 6px;font-size:16px}</style></head><body><div class="w" id="app"></div>
<script src="config.js"></script><script>
let T=sessionStorage.t||'';const app=document.getElementById('app');
const money=n=>'GHS '+(+n).toLocaleString('en-GH',{minimumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,d){const r=await(await fetch(CFG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,token:T,...d})})).json();if(r.auth===false){sessionStorage.removeItem('t');T='';loginView('Session expired. Sign in again.')}return r}
function loginView(m=''){app.innerHTML='<h1>Admin sign in</h1><p class="err">'+esc(m)+'</p><p><input id="e" type="email" placeholder="Email"> <input id="p" type="password" placeholder="Password"> <button id="go">Sign in</button></p>';
 go.onclick=async()=>{const r=await api('login',{email:e.value,password:p.value});if(r.ok){T=r.token;sessionStorage.t=T;main()}else loginView(r.error)}}
async function main(){app.innerHTML='Loading...';const [s,o]=await Promise.all([api('adminSummary',{}),api('adminOrders',{})]);if(!s.ok||!o.ok)return;
 const K=[['Orders',s.orders],['Revenue (est.)',money(s.revenue)],['Cash received',money(s.cashReceived)],['Outstanding',money(s.outstanding)],['Gross profit (est.)',money(s.grossProfit)],['Expenses',money(s.expenses)],['Net profit (est.)',money(s.netProfit)],['Low stock variants',s.lowStock]];
 app.innerHTML='<h1>Orders</h1><div class="k">'+K.map(k=>'<div><small>'+k[0]+'</small><b>'+k[1]+'</b></div>').join('')+'</div><small>'+esc(s.note)+'</small><p><input id="f" placeholder="Search name, phone, reference"> <button id="csv">Export CSV</button> <button id="manage">Manage products</button> <button id="out">Sign out</button></p><div id="list"></div>';
 const draw=()=>{const q=f.value.toLowerCase();list.innerHTML=o.orders.filter(x=>(x.name+x.phone+x.reference).toLowerCase().includes(q)).map(x=>
  '<div class="o"><b>'+esc(x.reference)+'</b> · '+esc(x.name)+' · '+esc(x.phone)+' · '+money(x.total)+'<br><small>'+esc(x.items.map(i=>i.product_name+' ('+i.variant_label+') x'+i.qty).join(', '))+'</small><div>'+
  '<select data-s="'+x.order_id+'">'+o.statuses.map(t=>'<option'+(t===x.order_status?' selected':'')+'>'+t+'</option>').join('')+'</select>'+
  '<span>'+esc(x.payment_status)+' · paid '+money(x.amount_paid)+'</span><button data-p="'+x.order_id+'">Record payment</button><button data-r="'+x.order_id+'">Record refund</button></div></div>').join('')||'<p>No orders yet.</p>'};
 draw();f.oninput=draw;manage.onclick=productsView;out.onclick=()=>{sessionStorage.removeItem('t');T='';loginView()};
 csv.onclick=()=>{const H=['reference','created_at','name','phone','total','amount_paid','payment_status','order_status'];const c=[H.join(',')].concat(o.orders.map(x=>H.map(k=>'"'+String(x[k]).replace(/"/g,'""')+'"').join(',')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c.join('\n')],{type:'text/csv'}));a.download='orders.csv';a.click()};
 list.onchange=async e=>{const id=e.target.dataset.s;if(!id)return;if(e.target.value==='Cancelled'&&!confirm('Cancel this order? Stock will be returned to inventory.')){main();return}
  const r=await api('adminSetStatus',{orderId:id,status:e.target.value});if(!r.ok)alert(r.error);main()};
 list.onclick=async e=>{const id=e.target.dataset.p||e.target.dataset.r;if(!id)return;const refund=!!e.target.dataset.r;
  const a=prompt((refund?'Refund':'Payment')+' amount (GHS)');if(!a)return;const m=prompt('Method: Cash, Mobile Money, Bank Transfer or Other','Mobile Money');const ref=prompt('Reference (optional)')||'';
  if(!confirm('Record '+(refund?'refund':'payment')+' of GHS '+a+'?'))return;const r=await api('adminPayment',{orderId:id,amount:a,method:m,reference:ref,type:refund?'refund':'payment'});if(!r.ok)alert(r.error);main()}}
const BADGES=['','New','Limited Edition','Sale','Sold out'];
function variantRow(v={},removable=false){
 return '<div class="variant" data-variant-id="'+esc(v.id||'')+'">'+
  '<label>Option name<input data-v="label" required maxlength="100" placeholder="One size, Gold, 6 mm" value="'+esc(v.label||'')+'"></label>'+
  '<label>SKU (optional)<input data-v="sku" maxlength="100" value="'+esc(v.sku||'')+'"></label>'+
  '<label>Price (GHS)<input data-v="price" type="number" min="0.01" step="0.01" required value="'+(v.price??'')+'"></label>'+
  '<label>Your cost (GHS)<input data-v="cost" type="number" min="0" step="0.01" value="'+(v.cost??0)+'"></label>'+
  '<label>Stock quantity<input data-v="stock" type="number" min="0" step="1" required value="'+(v.stock??0)+'"></label>'+
  '<label>Low-stock alert at<input data-v="minStock" type="number" min="0" step="1" value="'+(v.minStock??0)+'"></label>'+
  '<label class="check"><input data-v="active" type="checkbox"'+(v.active===false?'':' checked')+'> Available to sell</label>'+
  (removable?'<button type="button" data-remove-variant>Remove option</button>':'')+'</div>';
}
function readVariants(card){
 return [...card.querySelectorAll('.variant')].map(row=>({id:row.dataset.variantId,label:row.querySelector('[data-v="label"]').value,sku:row.querySelector('[data-v="sku"]').value,price:row.querySelector('[data-v="price"]').value,cost:row.querySelector('[data-v="cost"]').value,stock:row.querySelector('[data-v="stock"]').value,minStock:row.querySelector('[data-v="minStock"]').value,active:row.querySelector('[data-v="active"]').checked}));
}
function productFields(p={}){
 return '<label>Product name<input data-name required maxlength="150" value="'+esc(p.name||'')+'"></label>'+
  '<label>Category<input data-category maxlength="100" placeholder="Earrings, Bracelets..." value="'+esc(p.category||'')+'"></label>'+
  '<label>Description<textarea data-description maxlength="2000">'+esc(p.description||'')+'</textarea></label>'+
  '<label>Badge / collection<select data-badge>'+BADGES.map(b=>'<option value="'+esc(b)+'"'+(b===(p.badge||'')?' selected':'')+'>'+(b||'No badge')+'</option>').join('')+'</select></label>'+
  '<label>Photo URL (optional)<input data-image maxlength="2000" placeholder="https://..." value="'+esc(p.image||'')+'"></label>'+
  '<label class="check"><input data-featured type="checkbox"'+(p.featured?' checked':'')+'> Feature this product</label>'+
  '<label class="check"><input data-active type="checkbox"'+(p.active===false?'':' checked')+'> Active on storefront</label>';
}
async function productsView(message=''){
 app.innerHTML='<h1>Products</h1><p class="hint">Create products, set their prices and stock, and upload photos from your device. Each product needs at least one price option (for example, One size or Gold).</p><div class="toolbar"><button id="back">← Back to orders</button><button id="out">Sign out</button></div>'+(message?'<p class="status">'+esc(message)+'</p>':'')+'<p>Loading products...</p>';
 document.getElementById('back').onclick=main;
 document.getElementById('out').onclick=()=>{sessionStorage.removeItem('t');T='';loginView()};
 let result;
 try{result=await api('adminProducts',{})}catch(e){app.innerHTML+='<p class="err">Could not load products. Check your connection and try again.</p>';return}
 if(!result.ok){if(result.auth===false)return;app.innerHTML+='<p class="err">'+esc(result.error||'Could not load products.')+'</p>';return}
 app.innerHTML='<h1>Products</h1><p class="hint">Create products, set their prices and stock, and upload photos from your device. Each product needs at least one price option (for example, One size or Gold).</p><div class="toolbar"><button id="back">← Back to orders</button><button id="out">Sign out</button><button id="show-create">+ Add a product</button></div>'+(message?'<p class="status">'+esc(message)+'</p>':'')+
  '<form class="o product" id="create-product" hidden><h2>New product</h2>'+productFields({active:true})+'<h3 class="section-title">Prices and options</h3><div class="variant-list" data-variants>'+variantRow({label:'One size',price:'',cost:0,stock:0,minStock:0,active:true},true)+'</div><div class="toolbar"><button type="button" data-add-variant>Add another option</button><button type="submit">Create product</button></div><small class="status" aria-live="polite"></small></form>'+
  (result.products.length?'<div class="products" id="products">'+result.products.map(p=>
   '<form class="o product" data-id="'+esc(p.id)+'"><div class="product-head"><h2>'+esc(p.name||'Unnamed product')+'</h2><small>'+ (p.active?'Active':'Inactive')+'</small></div>'+
   (p.image?'<img class="preview" alt="'+esc(p.name)+' photo" src="'+esc(p.image)+'">':'<div class="preview"></div>')+productFields(p)+
   '<label>Upload photo<input data-upload type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label>'+
   '<h3 class="section-title">Prices and options</h3><div class="variant-list" data-variants">'+(p.variants.length?p.variants.map(v=>variantRow(v,false)).join(''):variantRow({label:'One size',price:'',cost:0,stock:0,minStock:0,active:true},true))+'</div>'+
   '<div class="toolbar"><button type="button" data-add-variant>Add another option</button><button type="submit">Save product</button></div><small class="status" aria-live="polite"></small></form>'
  ).join('')+'</div>':'<p>No products yet. Use “Add a product” above to create the first one.</p>');
 document.getElementById('back').onclick=main;
 document.getElementById('out').onclick=()=>{sessionStorage.removeItem('t');T='';loginView()};
 const createForm=document.getElementById('create-product'),products=document.getElementById('products');
 document.getElementById('show-create').onclick=()=>{createForm.hidden=!createForm.hidden;if(!createForm.hidden)createForm.querySelector('[data-name]').focus()};
 app.onclick=e=>{
  if(e.target.closest('[data-add-variant]')){const form=e.target.closest('form');form.querySelector('[data-variants]').insertAdjacentHTML('beforeend',variantRow({label:'',price:'',cost:0,stock:0,minStock:0,active:true},true));return}
  if(e.target.closest('[data-remove-variant]')){const list=e.target.closest('[data-variants]');if(list.querySelectorAll('.variant').length>1)e.target.closest('.variant').remove();return}
 };
 createForm.onsubmit=async e=>{
  e.preventDefault();const button=createForm.querySelector('[type=submit]'),status=createForm.querySelector('.status');
  button.disabled=true;status.textContent='Creating product...';
  try{
   const created=await api('adminCreateProduct',{name:createForm.querySelector('[data-name]').value,category:createForm.querySelector('[data-category]').value,description:createForm.querySelector('[data-description]').value,badge:createForm.querySelector('[data-badge]').value,imageUrl:createForm.querySelector('[data-image]').value,featured:createForm.querySelector('[data-featured]').checked,active:createForm.querySelector('[data-active]').checked,variants:readVariants(createForm)});
   if(!created.ok){status.textContent=created.error||'Could not create product.';return}
   productsView('Product created. Upload a photo or edit its details below.');
  }catch(error){status.textContent='Could not create product. Check your connection and try again.'}
  finally{button.disabled=false}
 };
 const handleUpload=async input=>{
  const file=input.files[0];if(!file)return;
  const card=input.closest('form'),status=card.querySelector('.status');
  if(file.size>5*1024*1024){status.textContent='Image must be 5 MB or smaller.';input.value='';return}
  status.textContent='Uploading photo...';
  const reader=new FileReader();
  reader.onload=async()=>{
   try{
    const uploaded=await api('adminUploadImage',{productId:card.dataset.id,fileName:file.name,mimeType:file.type,data:String(reader.result).split(',')[1]||''});
    if(!uploaded.ok){status.textContent=uploaded.error||'Upload failed.';return}
    card.querySelector('[data-image]').value=uploaded.image;
    let preview=card.querySelector('.preview');
    if(preview.tagName!=='IMG'){const image=document.createElement('img');image.className='preview';image.alt=card.querySelector('[data-name]').value+' photo';preview.replaceWith(image);preview=image}
    preview.src=uploaded.image;status.textContent='Photo uploaded and saved.';
   }catch(error){status.textContent='Upload failed. Check your connection and try again.'}
  };
  reader.onerror=()=>{status.textContent='Could not read this photo.'};
  reader.readAsDataURL(file);
 };
 app.onchange=e=>{if(e.target.matches('[data-upload]'))handleUpload(e.target)};
 const saveProduct=async(form)=>{
  const button=form.querySelector('[type=submit]'),status=form.querySelector('.status'),id=form.dataset.id;
  button.disabled=true;status.textContent='Saving product...';
  try{
   const saved=await api('adminUpdateProduct',{productId:id,name:form.querySelector('[data-name]').value,category:form.querySelector('[data-category]').value,description:form.querySelector('[data-description]').value,badge:form.querySelector('[data-badge]').value,imageUrl:form.querySelector('[data-image]').value,featured:form.querySelector('[data-featured]').checked,active:form.querySelector('[data-active]').checked});
   if(!saved.ok){status.textContent=saved.error||'Could not save product details.';return}
   const variants=await api('adminUpdateVariants',{productId:id,variants:readVariants(form)});
   status.textContent=variants.ok?'Product details, prices and stock saved.':(variants.error||'Product details saved, but prices and stock could not be saved.');
  }catch(error){status.textContent='Could not save changes. Check your connection and try again.'}
  finally{button.disabled=false}
 };
 app.onsubmit=e=>{if(e.target===createForm)return;const form=e.target.closest('#products form');if(form){e.preventDefault();saveProduct(form)}};
}
if(!CFG.API_URL)app.textContent='Set API_URL in config.js first.';else T?main():loginView();
</script></body></html>
