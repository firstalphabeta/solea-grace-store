<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><meta name="robots" content="noindex">
<style>body{font:15px/1.5 system-ui,sans-serif;margin:0;background:#F6F5F2;color:#14201B}.w{max-width:1100px;margin:auto;padding:16px}

.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}.product{margin:0;min-width:0}.product label{display:block;margin-top:10px}.product input,.product select,.product textarea{width:100%;margin-top:4px}.product textarea{min-height:78px}.product .preview{width:100%;height:220px;object-fit:cover;background:#f0efec;margin-top:10px}.product .status{display:block;margin-top:8px}.hint{color:#5C6660}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.variant-list{display:grid;gap:8px;margin-top:8px}.variant{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:10px;background:#F6F5F2;border:1px solid #E2DFD8}.variant label{margin:0;font-size:12px}.variant .check{display:flex;align-items:center;gap:6px;grid-column:span 2}.variant .check input,.check input{width:auto;margin:0}.product-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.product-head h2{font-size:20px}.section-title{margin:18px 0 6px;font-size:16px}.manual-order{max-width:760px}.manual-order label{display:block;margin:12px 0 4px}.manual-order input,.manual-order select,.manual-order textarea{width:100%;padding:10px;border:1px solid #CFCBC2;min-height:42px}.manual-order textarea{min-height:76px}.manual-line{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:8px;margin:9px 0;align-items:center}.manual-total{font-weight:600;margin:14px 0}
body.admin-on{background:#f5f4f0}#adminNav{position:fixed;inset:0 auto 0 0;width:238px;background:#17231e;color:#f8f6f0;padding:24px 16px;box-sizing:border-box;z-index:5;display:flex;flex-direction:column;gap:26px}#adminNav[hidden]{display:none}.brand{font-family:Georgia,serif;font-size:22px;letter-spacing:.04em}.brand small{display:block;color:#c5b794;font:11px system-ui;letter-spacing:.16em;margin-top:4px}.navlinks{display:grid;gap:6px}.navlinks button,.nav-bottom button{width:100%;text-align:left;background:transparent;color:#e5e5dd;border:0;border-radius:8px;padding:11px 12px}.navlinks button:hover,.navlinks button.active{background:#34443b;color:white}.nav-bottom{margin-top:auto}.nav-bottom button{color:#d8b873}.workspace{margin-left:238px!important;max-width:none!important;padding:34px clamp(18px,4vw,56px)!important}.workspace h1{font:500 clamp(26px,3vw,34px)/1.2 Georgia,serif;margin:4px 0 8px}.workspace h2{font-family:Georgia,serif}.workspace .k{grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px;margin:22px 0}.workspace .k div,.workspace .o{background:white;border:1px solid #e6e2d9;border-radius:12px;box-shadow:0 3px 14px #2c30220a;padding:17px}.workspace .k b{font-size:22px;margin-top:7px}.workspace input,.workspace select,.workspace textarea{border-radius:7px}.workspace button{border-radius:7px}.workspace .page-intro{color:#68726c;margin:0 0 20px}.workspace .section-card{background:white;border:1px solid #e6e2d9;border-radius:12px;padding:18px;margin:14px 0}.workspace table{width:100%;border-collapse:collapse;background:white}.workspace th,.workspace td{text-align:left;padding:11px 12px;border-bottom:1px solid #ece9e2;vertical-align:top}.workspace th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#69736c}.table-wrap{overflow:auto;border:1px solid #e6e2d9;border-radius:12px}.chart{display:flex;align-items:end;gap:8px;min-height:190px;padding:20px 10px 0;border-bottom:1px solid #dedbd4}.bar-column{flex:1;min-width:18px;text-align:center;font-size:11px;color:#68726c}.bar{position:relative;min-height:3px;max-width:40px;margin:auto;background:#a47b3f;border-radius:5px 5px 0 0}.bar-column span{display:block;white-space:nowrap;margin-top:7px}.dashboard-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:14px}.pill{display:inline-block;background:#f0eee8;border-radius:99px;padding:3px 9px;font-size:12px}.empty{padding:24px;color:#69736c;text-align:center}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.form-grid label{display:grid;gap:5px}.form-grid button{align-self:end}
@media(max-width:760px){#adminNav{position:sticky;inset:0;width:auto;height:auto;padding:10px 12px;gap:8px}.brand{font-size:18px}.brand small{display:none}.navlinks{display:flex;overflow:auto;gap:4px}.navlinks button{white-space:nowrap;width:auto;padding:8px 10px}.nav-bottom{display:flex;flex-direction:row;gap:4px;margin-top:0;overflow:auto}.nav-bottom button{width:auto;white-space:nowrap;padding:8px 10px}.workspace{margin-left:0!important;padding:20px 14px!important}.dashboard-grid{grid-template-columns:1fr}.workspace .k{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.manual-line{grid-template-columns:1fr 90px}.manual-line button{grid-column:span 2}}</style></head><body><div id="adminNav" hidden></div><div class="w" id="app"></div>
<script src="config.js"></script><script>
let T=sessionStorage.t||'';const app=document.getElementById('app'),nav=document.getElementById('adminNav');
const money=n=>'GHS '+(+n).toLocaleString('en-GH',{minimumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,d){const r=await(await fetch(CFG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,token:T,...d})})).json();if(r.auth===false){sessionStorage.removeItem('t');T='';loginView('Session expired. Sign in again.')}return r}
function signOut(){sessionStorage.removeItem('t');T='';nav.hidden=true;document.body.classList.remove('admin-on');loginView()}
function workspace(active){
 document.body.classList.add('admin-on');app.classList.add('workspace');nav.hidden=false;
 nav.innerHTML='<div class="brand">SOLEA GRACE<small>BUSINESS WORKSPACE</small></div><div class="navlinks">'+
  [['dashboard','Overview'],['orders','Orders'],['products','Products'],['customers','Customers'],['requests','Custom orders'],['expenses','Expenses'],['account','Account settings']].map(x=>'<button data-page="'+x[0]+'" class="'+(active===x[0]?'active':'')+'">'+x[1]+'</button>').join('')+
  '</div><div class="nav-bottom"><button data-page="manual">＋ Add WhatsApp order</button><button data-page="logout">Sign out</button></div>';
 nav.onclick=e=>{const b=e.target.closest('[data-page]');if(!b)return;const page=b.dataset.page;
  if(page==='logout')return signOut();
  if(page==='dashboard')dashboardView();else if(page==='orders')main();else if(page==='products')productsView();
  else if(page==='manual')manualOrderView();else if(page==='customers')customersView();
  else if(page==='requests')customRequestsView();else if(page==='expenses')expensesView();
  else if(page==='account')credentialsView();
 };
}
function loginView(m=''){nav.hidden=true;document.body.classList.remove('admin-on');app.classList.remove('workspace');app.innerHTML='<div class="section-card" style="max-width:440px;margin:12vh auto"><h1>Admin sign in</h1><p class="err">'+esc(m)+'</p><p><input id="e" type="email" placeholder="Email" autocomplete="username"> <input id="p" type="password" placeholder="Password" autocomplete="current-password"> <button id="go">Sign in</button></p></div>';
 go.onclick=async()=>{const r=await api('login',{email:e.value,password:p.value});if(r.ok){T=r.token;sessionStorage.t=T;dashboardView()}else loginView(r.error)}}
function dashboardView(){
 workspace('dashboard');
 app.innerHTML='<h1>Business overview</h1><p class="page-intro">A clear view of sales, cash flow, inventory, and customer activity.</p><div class="toolbar"><label>From <input id="from" type="date"></label><label>To <input id="to" type="date"></label><button id="apply">Apply dates</button><button id="last7">Last 7 days</button><button id="last30">Last 30 days</button></div><p id="dashboard-note" class="hint">Loading business metrics…</p><div id="dashboard-content"></div>';
 const to=new Date(),from=new Date();from.setDate(from.getDate()-6);
 const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
 document.getElementById('from').value=iso(from);document.getElementById('to').value=iso(to);
 const load=async()=>{const start=document.getElementById('from').value,end=document.getElementById('to').value;
  const note=document.getElementById('dashboard-note'),content=document.getElementById('dashboard-content');
  if(start&&end&&start>end){note.textContent='The start date must be on or before the end date.';content.innerHTML='';return}
  if(start&&end&&(new Date(end+'T00:00:00')-new Date(start+'T00:00:00'))/86400000>30){note.textContent='Choose a date range of 31 days or less to view the daily chart.';content.innerHTML='';return}
  note.textContent='Loading business metrics…';content.innerHTML='';
  try{const r=await api('adminDashboard',{from:start,to:end});if(r.auth===false)return;if(!r.ok){note.textContent=r.error||'Could not load dashboard data.';return}
   const s=r.summary, k=[['Orders',s.orders],['Sales (est.)',money(s.revenue)],['Payments received',money(s.cashReceived)],['Outstanding',money(s.outstanding)],['Gross profit (est.)',money(s.grossProfit)],['Expenses',money(s.expenses)],['Net profit (est.)',money(s.netProfit)],['Low-stock variants',s.lowStock]];
   const max=Math.max(1,...r.series.map(x=>x.sales));
   const bars=r.series.map(x=>'<div class="bar-column" title="'+esc(x.date)+' · Sales '+money(x.sales)+'"><div class="bar" style="height:'+Math.max(3,x.sales/max*130)+'px"></div><span>'+esc(x.date.slice(5))+'</span></div>').join('');
   const stock=r.lowStock.length?r.lowStock.map(x=>'<tr><td>'+esc(x.product)+' · '+esc(x.variant)+'</td><td>'+x.stock+' / '+x.minStock+'</td></tr>').join(''):'<tr><td colspan="2" class="empty">Stock levels look healthy.</td></tr>';
   const recent=r.recentOrders.length?r.recentOrders.map(x=>'<tr><td>'+esc(x.reference)+'</td><td>'+esc(x.name)+'</td><td>'+money(x.total)+'</td><td>'+esc(x.order_status)+'</td></tr>').join(''):'<tr><td colspan="4" class="empty">No orders yet.</td></tr>';
   const top=r.topProducts.length?r.topProducts.map(x=>'<li>'+esc(x.name)+' <span class="pill">'+x.quantity+' sold</span></li>').join(''):'<li class="empty">Sales will appear here as orders come in.</li>';
   content.innerHTML='<div class="k">'+k.map(x=>'<div><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div><p class="hint">'+esc(s.note)+'</p><div class="dashboard-grid"><section class="section-card"><h2>Sales trend</h2><div class="chart">'+bars+'</div><p class="hint">Gross sales from non-cancelled orders; this is not website traffic.</p></section><section class="section-card"><h2>Business at a glance</h2><p><b>'+r.customers+'</b> customers</p><p><b>'+r.products+'</b> active products</p><p><b>'+r.openRequests+'</b> open custom requests</p><p><b>'+r.lowStockCount+'</b> stock items need attention</p><h3>Top sellers</h3><ol>'+top+'</ol></section></div><section class="section-card"><h2>Recent orders</h2><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>'+recent+'</tbody></table></div></section><section class="section-card"><h2>Low stock</h2><div class="table-wrap"><table><thead><tr><th>Product / option</th><th>Stock / threshold</th></tr></thead><tbody>'+stock+'</tbody></table></div></section>';
   note.textContent='Showing '+start+' to '+end+'. '+r.openRequests+' open custom requests.';
  }catch(error){note.textContent='Could not load dashboard. Check your connection and try again.'}
 };
 document.getElementById('apply').onclick=load;
 document.getElementById('last7').onclick=()=>{const d=new Date();const f=new Date();f.setDate(d.getDate()-6);document.getElementById('from').value=iso(f);document.getElementById('to').value=iso(d);load()};
 document.getElementById('last30').onclick=()=>{const d=new Date();const f=new Date();f.setDate(d.getDate()-29);document.getElementById('from').value=iso(f);document.getElementById('to').value=iso(d);load()};
 load();
}
async function customersView(){
 workspace('customers');app.innerHTML='<h1>Customers</h1><p class="page-intro">Customer records and their order history, with totals based on valid orders.</p><p id="customer-note">Loading customers…</p><div id="customers-table"></div>';
 try{const r=await api('adminCustomers',{});if(r.auth===false)return;if(!r.ok){document.getElementById('customer-note').textContent=r.error||'Could not load customers.';return}
  document.getElementById('customer-note').textContent=r.customers.length+' customer records';
  document.getElementById('customers-table').innerHTML=r.customers.length?'<div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Orders</th><th>Lifetime sales</th><th>Last order</th></tr></thead><tbody>'+r.customers.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.phone)+'</td><td>'+esc(c.email)+'</td><td>'+c.orders+'</td><td>'+money(c.spent)+'</td><td>'+esc(c.lastOrder||'—')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="section-card empty">No customers yet. Customers are added when orders are placed.</div>';
 }catch(error){document.getElementById('customer-note').textContent='Could not load customers. Check your connection and try again.'}
}
async function customRequestsView(){
 workspace('requests');app.innerHTML='<h1>Custom orders</h1><p class="page-intro">Track made-to-order enquiries from first contact through completion.</p><p id="request-note">Loading requests…</p><div id="requests-table"></div>';
 try{const r=await api('adminCustomOrders',{});if(r.auth===false)return;if(!r.ok){document.getElementById('request-note').textContent=r.error||'Could not load custom requests.';return}
  document.getElementById('request-note').textContent=r.requests.length+' requests';
  document.getElementById('requests-table').innerHTML=r.requests.length?'<div class="table-wrap"><table><thead><tr><th>Received</th><th>Customer</th><th>Request</th><th>Details</th><th>Status</th></tr></thead><tbody>'+r.requests.map(x=>'<tr><td>'+esc(x.created_at)+'</td><td>'+esc(x.name)+'<br>'+esc(x.phone)+'<br>'+esc(x.email)+'</td><td>'+esc(x.type)+'<br>'+esc(x.material)+' · '+esc(x.colour)+' · '+esc(x.size)+'</td><td>'+esc(x.description)+'<br><small>Budget: '+esc(x.budget)+'</small></td><td><select data-request="'+esc(x.request_id)+'">'+r.statuses.map(s=>'<option'+(s===x.status?' selected':'')+'>'+esc(s)+'</option>').join('')+'</select></td></tr>').join('')+'</tbody></table></div>':'<div class="section-card empty">No custom requests yet.</div>';
  document.getElementById('requests-table').onchange=async e=>{const id=e.target.dataset.request;if(!id)return;const result=await api('adminSetCustomStatus',{requestId:id,status:e.target.value});if(result.auth===false)return;if(!result.ok)alert(result.error||'Could not update request status.');customRequestsView()};
 }catch(error){document.getElementById('request-note').textContent='Could not load custom requests. Check your connection and try again.'}
}
async function expensesView(message=''){
 workspace('expenses');app.innerHTML='<h1>Expenses</h1><p class="page-intro">Record and review operating expenses. Entries affect the estimated profit on your dashboard.</p>'+(message?'<p role="status" class="status">'+esc(message)+'</p>':'')+'<section class="section-card"><h2>Add expense</h2><form id="expense-form" class="form-grid"><label>Date<input name="date" type="date" required></label><label>Category<input name="category" maxlength="100" required placeholder="Packaging, delivery…"></label><label>Amount (GHS)<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Payment method<input name="method" maxlength="100" placeholder="Cash, Mobile Money…"></label><label>Description<input name="description" maxlength="500"></label><label>Reference<input name="reference" maxlength="150"></label><button type="submit">Save expense</button></form><p id="expense-status" role="status"></p></section><h2>Recent expenses</h2><p id="expense-note">Loading expenses…</p><div id="expenses-table"></div>';
 const date=new Date();document.querySelector('#expense-form [name=date]').value=new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,10);
 document.getElementById('expense-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,status=document.getElementById('expense-status'),button=f.querySelector('button');button.disabled=true;status.textContent='Saving…';
  try{const val=name=>f.elements.namedItem(name).value;const result=await api('adminAddExpense',{date:val('date'),category:val('category'),amount:val('amount'),method:val('method'),description:val('description'),reference:val('reference')});if(!result.ok){status.textContent=result.error||'Could not save expense.';return}expensesView('Expense saved.')}
  catch(error){status.textContent='Could not save expense. Check your connection and try again.'}finally{button.disabled=false}
 };
 try{const r=await api('adminExpenses',{});if(r.auth===false)return;if(!r.ok){document.getElementById('expense-note').textContent=r.error||'Could not load expenses.';return}
  document.getElementById('expense-note').textContent=r.expenses.length+' entries';
  document.getElementById('expenses-table').innerHTML=r.expenses.length?'<div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Method</th><th>Reference</th><th>Amount</th></tr></thead><tbody>'+r.expenses.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.description)+'</td><td>'+esc(x.method)+'</td><td>'+esc(x.reference)+'</td><td>'+money(x.amount)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="section-card empty">No expenses recorded yet.</div>';
 }catch(error){document.getElementById('expense-note').textContent='Could not load expenses. Check your connection and try again.'}
}
async function main(){workspace('orders');app.innerHTML='Loading...';try{const [s,o]=await Promise.all([api('adminSummary',{}),api('adminOrders',{})]);if(s.auth===false||o.auth===false)return;if(!s.ok||!o.ok){app.innerHTML='<h1>Orders</h1><p class="err">'+esc(s.error||o.error||'Could not load orders.')+'</p>';return}
 const K=[['Orders',s.orders],['Revenue (est.)',money(s.revenue)],['Cash received',money(s.cashReceived)],['Outstanding',money(s.outstanding)],['Gross profit (est.)',money(s.grossProfit)],['Expenses',money(s.expenses)],['Net profit (est.)',money(s.netProfit)],['Low stock variants',s.lowStock]];
 app.innerHTML='<h1>Orders</h1><div class="k">'+K.map(k=>'<div><small>'+k[0]+'</small><b>'+k[1]+'</b></div>').join('')+'</div><small>'+esc(s.note)+'</small><p><input id="f" placeholder="Search name, phone, reference"> <button id="csv">Export CSV</button> <button id="manual">Add WhatsApp order</button> <button id="manage">Manage products</button> <button id="account">Account settings</button> <button id="out">Sign out</button></p><div id="list"></div>';
 const draw=()=>{const q=f.value.toLowerCase();list.innerHTML=o.orders.filter(x=>(x.name+x.phone+x.reference).toLowerCase().includes(q)).map(x=>
  '<div class="o"><b>'+esc(x.reference)+'</b> · '+esc(x.name)+' · '+esc(x.phone)+' · '+money(x.total)+'<br><small>'+esc(x.items.map(i=>i.product_name+' ('+i.variant_label+') x'+i.qty).join(', '))+'</small><div>'+
  '<select data-s="'+x.order_id+'">'+o.statuses.map(t=>'<option'+(t===x.order_status?' selected':'')+'>'+t+'</option>').join('')+'</select>'+
  '<span>'+esc(x.payment_status)+' · paid '+money(x.amount_paid)+'</span><button data-p="'+x.order_id+'">Record payment</button><button data-r="'+x.order_id+'">Record refund</button></div></div>').join('')||'<p>No orders yet.</p>'};
 draw();f.oninput=draw;manage.onclick=productsView;manual.onclick=manualOrderView;account.onclick=credentialsView;out.onclick=()=>{sessionStorage.removeItem('t');T='';loginView()};
 csv.onclick=()=>{const H=['reference','created_at','name','phone','total','amount_paid','payment_status','order_status'];const c=[H.join(',')].concat(o.orders.map(x=>H.map(k=>'"'+String(x[k]).replace(/"/g,'""')+'"').join(',')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c.join('\n')],{type:'text/csv'}));a.download='orders.csv';a.click()};
 list.onchange=async e=>{const id=e.target.dataset.s;if(!id)return;if(e.target.value==='Cancelled'&&!confirm('Cancel this order? Stock will be returned to inventory.')){main();return}
  const r=await api('adminSetStatus',{orderId:id,status:e.target.value});if(r.auth===false)return;if(!r.ok)alert(r.error);main()};
 list.onclick=async e=>{const id=e.target.dataset.p||e.target.dataset.r;if(!id)return;const refund=!!e.target.dataset.r;
  const a=prompt((refund?'Refund':'Payment')+' amount (GHS)');if(!a)return;const m=prompt('Method: Cash, Mobile Money, Bank Transfer or Other','Mobile Money');const ref=prompt('Reference (optional)')||'';
  if(!confirm('Record '+(refund?'refund':'payment')+' of GHS '+a+'?'))return;const r=await api('adminPayment',{orderId:id,amount:a,method:m,reference:ref,type:refund?'refund':'payment'});if(r.auth===false)return;if(!r.ok)alert(r.error);main()}}catch(error){app.innerHTML='<h1>Orders</h1><p class="err">Could not load orders. Check your connection and try again.</p>'}
}
 async function credentialsView(message=''){
  workspace('account');
  app.innerHTML='<h1>Account settings</h1><p>Change your admin sign-in email and, if you want, set a new password. Your password is stored as a secure hash, never as readable text.</p><div class="toolbar"><button id="back">← Back to orders</button><button id="out">Sign out</button></div><p>Loading account...</p>';
  document.getElementById('back').onclick=main;
  document.getElementById('out').onclick=()=>{sessionStorage.removeItem('t');T='';loginView()};
  let account;
  try{account=await api('adminAccount',{})}catch(error){app.innerHTML+='<p class="err">Could not load account settings. Check your connection and try again.</p>';return}
  if(!account.ok){if(account.auth===false)return;app.innerHTML+='<p class="err">'+esc(account.error||'Could not load account settings.')+'</p>';return}
  app.innerHTML='<h1>Account settings</h1><p>Change your admin sign-in email and, if you want, set a new password. Your password is stored as a secure hash, never as readable text.</p><div class="toolbar"><button id="back">← Back to orders</button><button id="out">Sign out</button></div>'+
   (message?'<p role="status">'+esc(message)+'</p>':'')+'<form class="o" id="credentials-form" style="max-width:520px"><label>Admin email<input name="email" type="email" value="'+esc(account.email)+'" autocomplete="username" required></label><label>Current password<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>New password (leave blank to keep current)<input name="newPassword" type="password" autocomplete="new-password" minlength="12"></label><small>Use at least 12 characters if changing your password.</small><label>Confirm new password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="12"></label><p class="err" id="credentials-error" role="status" aria-live="polite"></p><button type="submit">Save account settings</button></form>';
  document.getElementById('back').onclick=main;
  document.getElementById('out').onclick=()=>{sessionStorage.removeItem('t');T='';loginView()};
  const form=document.getElementById('credentials-form');
  form.onsubmit=async e=>{
   e.preventDefault();
   const password=form.elements.newPassword.value,error=document.getElementById('credentials-error');
   if(password!==form.elements.confirmPassword.value){error.textContent='The new passwords do not match.';return}
   const button=form.querySelector('button[type=submit]');button.disabled=true;error.textContent='Saving account settings...';
   try{
    const result=await api('adminChangeCredentials',{email:form.elements.email.value,currentPassword:form.elements.currentPassword.value,newPassword:password});
    if(!result.ok){error.textContent=result.error||'Could not update your account.';return}
    T=result.token;sessionStorage.t=T;
    app.innerHTML='<h1>Account updated</h1><p>Your sign-in details were updated successfully. You are still signed in. Use <strong>'+esc(result.email)+'</strong> the next time you log in.</p><button id="back">Back to orders</button>';
    document.getElementById('back').onclick=main;
   }catch(error){document.getElementById('credentials-error').textContent='Could not update your account. Check your connection and try again.'}
   finally{button.disabled=false}
  };
 }
 async function manualOrderView(){
  workspace('orders');
  app.innerHTML='<h1>Record WhatsApp order</h1><p class="hint">Enter the customer and items from your WhatsApp conversation. Stock will be reserved, and the order will appear in Orders as unpaid until you record their payment.</p><div class="toolbar"><button id="back">← Back to orders</button><button id="out">Sign out</button></div><p>Loading available products...</p>';
  document.getElementById('back').onclick=main;
  document.getElementById('out').onclick=()=>{sessionStorage.removeItem('t');T='';loginView()};
  let result;
  try{result=await api('adminProducts',{})}catch(e){app.innerHTML+='<p class="err">Could not load products. Check your connection and try again.</p>';return}
  if(!result.ok){if(result.auth===false)return;app.innerHTML+='<p class="err">'+esc(result.error||'Could not load products.')+'</p>';return}
  const products=result.products.filter(p=>p.active);
  const choices=products.flatMap(p=>p.variants.filter(v=>v.active&&Number(v.stock)>0).map(v=>({id:v.id,label:p.name+' · '+v.label+' · '+money(v.price)+' · '+v.stock+' in stock',stock:Number(v.stock),price:Number(v.price)})));
  const options='<option value="">Choose product / option</option>'+choices.map(v=>'<option value="'+esc(v.id)+'" data-stock="'+v.stock+'" data-price="'+v.price+'">'+esc(v.label)+'</option>').join('');
  app.innerHTML='<h1>Record WhatsApp order</h1><p class="hint">Enter the customer and items from your WhatsApp conversation. Stock will be reserved, and the order will appear in Orders as unpaid until you record their payment.</p><div class="toolbar"><button id="back">← Back to orders</button><button id="out">Sign out</button></div>'+
   (choices.length?'<form class="o manual-order" id="manual-form"><label>Customer name<input name="name" required minlength="2"></label><label>WhatsApp phone number<input name="phone" type="tel" required placeholder="+233..."></label><label>Email (optional)<input name="email" type="email"></label><label>Fulfilment<select name="method"><option value="delivery">Delivery</option><option value="pickup">Pickup</option></select></label><div id="delivery-fields"><label>Delivery address<input name="address"></label><label>Region / city<input name="region" placeholder="Accra"></label></div><h2 class="section-title">Order items</h2><div id="manual-items"></div><div class="toolbar"><button type="button" id="add-item">Add another item</button></div><label>Notes (optional)<textarea name="notes" maxlength="400" placeholder="Order details from WhatsApp"></textarea></label><p class="hint">Delivery fee is calculated from your Settings sheet. You can record the payment after saving the order.</p><p class="status" id="manual-status" aria-live="polite"></p><button type="submit">Save WhatsApp order</button></form>':'<p>No products with available stock yet. Add a product and set its stock under Manage products first.</p>');
  document.getElementById('back').onclick=main;
  document.getElementById('out').onclick=()=>{sessionStorage.removeItem('t');T='';loginView()};
  const form=document.getElementById('manual-form');if(!form)return;
  const itemList=document.getElementById('manual-items');
  const addItem=()=>{itemList.insertAdjacentHTML('beforeend','<div class="manual-line"><select data-item required>'+options+'</select><input data-qty type="number" min="1" max="20" value="1" required><button type="button" data-remove-item>Remove</button></div>')};
  addItem();
  document.getElementById('add-item').onclick=addItem;
  itemList.onclick=e=>{if(e.target.closest('[data-remove-item]')&&itemList.children.length>1)e.target.closest('.manual-line').remove()};
  form.elements.method.onchange=()=>{document.getElementById('delivery-fields').hidden=form.elements.method.value==='pickup'};
  form.onsubmit=async e=>{
   e.preventDefault();const button=form.querySelector('[type=submit]'),status=document.getElementById('manual-status');
   const items=[...itemList.querySelectorAll('.manual-line')].map(line=>({variantId:line.querySelector('[data-item]').value,qty:line.querySelector('[data-qty]').value}));
   for(const line of itemList.querySelectorAll('.manual-line')){
    const option=line.querySelector('[data-item]').selectedOptions[0],qty=Number(line.querySelector('[data-qty]').value);
    if(!option.value){status.textContent='Choose a product option for each order item.';return}
    if(qty<1||qty>Number(option.dataset.stock)){status.textContent='Quantity exceeds available stock for '+option.textContent+'.';return}
   }
   button.disabled=true;status.textContent='Saving WhatsApp order...';
   try{
    const order=await api('adminManualOrder',{name:form.elements.name.value,phone:form.elements.phone.value,email:form.elements.email.value,method:form.elements.method.value,address:form.elements.address.value,region:form.elements.region.value,notes:form.elements.notes.value,items});
    if(!order.ok){status.textContent=order.error||'Could not save order.';return}
    app.innerHTML='<h1>WhatsApp order saved</h1><p>Order <strong>'+esc(order.reference)+'</strong> has been added.</p><p>Total: <strong>'+money(order.total)+'</strong> · Payment status: Unpaid</p><p>Stock has been reserved. Open the order list to record payment when the customer pays.</p><div class="toolbar"><button id="back">Back to orders</button><button id="another">Record another WhatsApp order</button></div>';
    document.getElementById('back').onclick=main;document.getElementById('another').onclick=manualOrderView;
   }catch(error){status.textContent='Could not save order. Check your connection and try again.'}
   finally{button.disabled=false}
  };
 }
 const BADGES=['','New','Limited Edition','Sale','Sold out'];
function variantRow(v={},removable=false){
 return '<div class="variant" data-variant-id="'+esc(v.id||'')+'">'+
  '<label>Option name<input data-v="label" required maxlength="100" placeholder="One size, Gold, 6 mm" value="'+esc(v.label||'')+'"></label>'+
  '<label>SKU (optional)<input data-v="sku" maxlength="100" value="'+esc(v.sku||'')+'"></label>'+
  '<label>Price (GHS)<input data-v="price" type="number" min="0.01" step="0.01" required value="'+(v.price??'')+'"></label>'+
  '<label>Your cost (GHS)<input data-v="cost" type="number" min="0" step="0.01" value="'+(v.cost??0)+'"></label>'+
  '<label>Stock quantity<input data-v="stock" type="number" min="0" step="1" required value="'+(v.stock??0)+'"></label>'+
  '<label>Low-stock alert at<input data-v="minStock" type="number" min="0" step="1" value="'+(v.minStock??0)+'"></label>'+
  '<label class="check"><input data-v="active" type="checkbox"'+(v.active===false?'':' checked')+'> Available to sell</label>'+
  (removable?'<button type="button" data-remove-variant>Remove option</button>':'')+'</div>';
}
function readVariants(card){
 return [...card.querySelectorAll('.variant')].map(row=>({id:row.dataset.variantId,label:row.querySelector('[data-v="label"]').value,sku:row.querySelector('[data-v="sku"]').value,price:row.querySelector('[data-v="price"]').value,cost:row.querySelector('[data-v="cost"]').value,stock:row.querySelector('[data-v="stock"]').value,minStock:row.querySelector('[data-v="minStock"]').value,active:row.querySelector('[data-v="active"]').checked}));
}
function productFields(p={}){
 return '<label>Product name<input data-name required maxlength="150" value="'+esc(p.name||'')+'"></label>'+
  '<label>Category<input data-category maxlength="100" placeholder="Earrings, Bracelets..." value="'+esc(p.category||'')+'"></label>'+
  '<label>Description<textarea data-description maxlength="2000">'+esc(p.description||'')+'</textarea></label>'+
  '<label>Badge / collection<select data-badge>'+BADGES.map(b=>'<option value="'+esc(b)+'"'+(b===(p.badge||'')?' selected':'')+'>'+(b||'No badge')+'</option>').join('')+'</select></label>'+
  '<label>Photo URL (optional)<input data-image maxlength="2000" placeholder="https://..." value="'+esc(p.image||'')+'"></label>'+
  '<label class="check"><input data-featured type="checkbox"'+(p.featured?' checked':'')+'> Feature this product</label>'+
  '<label class="check"><input data-active type="checkbox"'+(p.active===false?'':' checked')+'> Active on storefront</label>';
}
async function productsView(message=''){
 workspace('products');
 app.innerHTML='<h1>Products</h1><p class="hint">Create products, set their prices and stock, and upload photos from your device. Each product needs at least one price option (for example, One size or Gold).</p><div class="toolbar"><button id="back">← Back to orders</button><button id="out">Sign out</button></div>'+(message?'<p class="status">'+esc(message)+'</p>':'')+'<p>Loading products...</p>';
 document.getElementById('back').onclick=main;
 document.getElementById('out').onclick=()=>{sessionStorage.removeItem('t');T='';loginView()};
 let result;
 try{result=await api('adminProducts',{})}catch(e){app.innerHTML+='<p class="err">Could not load products. Check your connection and try again.</p>';return}
 if(!result.ok){if(result.auth===false)return;app.innerHTML+='<p class="err">'+esc(result.error||'Could not load products.')+'</p>';return}
 app.innerHTML='<h1>Products</h1><p class="hint">Create products, set their prices and stock, and upload photos from your device. Each product needs at least one price option (for example, One size or Gold).</p><div class="toolbar"><button id="back">← Back to orders</button><button id="out">Sign out</button><button id="show-create">+ Add a product</button></div>'+(message?'<p class="status">'+esc(message)+'</p>':'')+
  '<form class="o product" id="create-product" hidden><h2>New product</h2>'+productFields({active:true})+'<h3 class="section-title">Prices and options</h3><div class="variant-list" data-variants>'+variantRow({label:'One size',price:'',cost:0,stock:0,minStock:0,active:true},true)+'</div><div class="toolbar"><button type="button" data-add-variant>Add another option</button><button type="submit">Create product</button></div><small class="status" aria-live="polite"></small></form>'+
  (result.products.length?'<div class="products" id="products">'+result.products.map(p=>
   '<form class="o product" data-id="'+esc(p.id)+'"><div class="product-head"><h2>'+esc(p.name||'Unnamed product')+'</h2><small>'+ (p.active?'Active':'Inactive')+'</small></div>'+

   '<label>Upload photo<input data-upload type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label>'+
   '<h3 class="section-title">Prices and options</h3><div class="variant-list" data-variants">'+(p.variants.length?p.variants.map(v=>variantRow(v,false)).join(''):variantRow({label:'One size',price:'',cost:0,stock:0,minStock:0,active:true},true))+'</div>'+
   '<div class="toolbar"><button type="button" data-add-variant>Add another option</button><button type="submit">Save product</button></div><small class="status" aria-live="polite"></small></form>'
  ).join('')+'</div>':'<p>No products yet. Use “Add a product” above to create the first one.</p>');
 document.getElementById('back').onclick=main;
 document.getElementById('out').onclick=()=>{sessionStorage.removeItem('t');T='';loginView()};
 const createForm=document.getElementById('create-product'),products=document.getElementById('products');
 document.getElementById('show-create').onclick=()=>{createForm.hidden=!createForm.hidden;if(!createForm.hidden)createForm.querySelector('[data-name]').focus()};
 app.onclick=e=>{
  if(e.target.closest('[data-add-variant]')){const form=e.target.closest('form');form.querySelector('[data-variants]').insertAdjacentHTML('beforeend',variantRow({label:'',price:'',cost:0,stock:0,minStock:0,active:true},true));return}

 };
 createForm.onsubmit=async e=>{
  e.preventDefault();const button=createForm.querySelector('[type=submit]'),status=createForm.querySelector('.status');
  button.disabled=true;status.textContent='Creating product...';
  try{
   const created=await api('adminCreateProduct',{name:createForm.querySelector('[data-name]').value,category:createForm.querySelector('[data-category]').value,description:createForm.querySelector('[data-description]').value,badge:createForm.querySelector('[data-badge]').value,imageUrl:createForm.querySelector('[data-image]').value,featured:createForm.querySelector('[data-featured]').checked,active:createForm.querySelector('[data-active]').checked,variants:readVariants(createForm)});
   if(!created.ok){status.textContent=created.error||'Could not create product.';return}
   productsView('Product created. Upload a photo or edit its details below.');
  }catch(error){status.textContent='Could not create product. Check your connection and try again.'}
  finally{button.disabled=false}
 };
 const handleUpload=async input=>{
  const file=input.files[0];if(!file)return;
  const card=input.closest('form'),status=card.querySelector('.status');
  if(file.size>5*1024*1024){status.textContent='Image must be 5 MB or smaller.';input.value='';return}
  status.textContent='Uploading photo...';
  const reader=new FileReader();
  reader.onload=async()=>{
   try{
    const uploaded=await api('adminUploadImage',{productId:card.dataset.id,fileName:file.name,mimeType:file.type,data:String(reader.result).split(',')[1]||''});
    if(!uploaded.ok){status.textContent=uploaded.error||'Upload failed.';return}
    card.querySelector('[data-image]').value=uploaded.image;
    let preview=card.querySelector('.preview');
    if(preview.tagName!=='IMG'){const image=document.createElement('img');image.className='preview';image.alt=card.querySelector('[data-name]').value+' photo';preview.replaceWith(image);preview=image}
    preview.src=uploaded.image;status.textContent='Photo uploaded and saved.';
   }catch(error){status.textContent='Upload failed. Check your connection and try again.'}
  };
  reader.onerror=()=>{status.textContent='Could not read this photo.'};
  reader.readAsDataURL(file);
 };
 app.onchange=e=>{if(e.target.matches('[data-upload]'))handleUpload(e.target)};
 const saveProduct=async(form)=>{
  const button=form.querySelector('[type=submit]'),status=form.querySelector('.status'),id=form.dataset.id;
  button.disabled=true;status.textContent='Saving product...';
  try{
   const saved=await api('adminUpdateProduct',{productId:id,name:form.querySelector('[data-name]').value,category:form.querySelector('[data-category]').value,description:form.querySelector('[data-description]').value,badge:form.querySelector('[data-badge]').value,imageUrl:form.querySelector('[data-image]').value,featured:form.querySelector('[data-featured]').checked,active:form.querySelector('[data-active]').checked});
   if(!saved.ok){status.textContent=saved.error||'Could not save product details.';return}
   const variants=await api('adminUpdateVariants',{productId:id,variants:readVariants(form)});
   status.textContent=variants.ok?'Product details, prices and stock saved.':(variants.error||'Product details saved, but prices and stock could not be saved.');
  }catch(error){status.textContent='Could not save changes. Check your connection and try again.'}
  finally{button.disabled=false}
 };
 app.onsubmit=e=>{if(e.target===createForm)return;const form=e.target.closest('#products form');if(form){e.preventDefault();saveProduct(form)}};
}
if(!CFG.API_URL)app.textContent='Set API_URL in config.js first.';else T?dashboardView():loginView();
